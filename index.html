<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/d6357e4321.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="dark-theme">
    <div class="container">
      <header class="header">
        <div class="logo-wrapper">
          <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
          <h1>AI Image Generator</h1>
        </div>

        <button type="button" class="theme-toggle">
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>
      <div class="main-content">
        <form action="#" class="prompt-form">
          <div class="prompt-container">
            <textarea
              name="prompt"
              placeholder="Describe what you imagine..."
              class="prompt-input"
              required
            ></textarea>
            <button type="button" class="prompt-btn">
              <i class="fa-solid fa-dice"></i>
            </button>
          </div>
          <div class="prompt-action">
            <div class="select-wrapper">
              <select
                class="custom-select"
                id="model-select"
                name="model"
                required
              >
                <option value="" selected disabled>Select Model</option>

                <option value="black-forest-labs/FLUX.1-schnell">
                  FLUX.1-schnell
                </option>

                <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>

                <option value="stabilityai/stable-diffusion-xl-base-1.0">
                  Stable-Diffusion-XL
                </option>

                <option value="runwayml/stable-diffusion-v1-5">
                  Stable-Diffusion-v1.5
                </option>

                <option value="prompthero/openjourney">Openjourney</option>
              </select>
            </div>
            <div class="select-wrapper">
              <select
                class="custom-select"
                id="count-select"
                name="count"
                required
              >
                <option value="" selected disabled>Image Count</option>
                <option value="1">1 Image</option>
                <option value="2">2 Images</option>
                <option value="3">3 Images</option>
                <option value="4">4 Images</option>
              </select>
            </div>
            <div class="select-wrapper">
              <select
                class="custom-select"
                id="ratio-select"
                name="aspect-ratio"
                required
              >
                <option value="" selected disabled>Aspect Ratio</option>
                <option value="1/1">Square (1:1)</option>
                <option value="16/9">Landscape (16:9)</option>
                <option value="9/16">Portrait (9:16)</option>
              </select>
            </div>
            <button type="submit" class="generate-btn">
              <i class="fa-solid fa-wand-sparkles"></i>
              Generate
            </button>
          </div>
          <div class="gallery-grid"></div>
        </form>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
